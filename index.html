<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CV Tailor — Dani Szwarc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">

  <!-- Header -->
  <header>
    <div class="header-left">
      <div class="logo">cv<span>.</span>tailor</div>
      <div class="version-tag">v1.0</div>
    </div>
    <div style="font-family:var(--mono);font-size:11px;color:var(--text-3)">qwen3.6 via nan.builders</div>
  </header>

  <!-- Main -->
  <main>

    <!-- Left panel: input -->
    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">Job Description</span>
      </div>
      <div class="panel-body">

        <!-- CV Upload -->
        <div class="cv-upload-zone" id="cvDropZone">
          <input
            type="file"
            id="cvFileInput"
            accept=".pdf"
            onchange="handleCVUpload(this.files[0])"
          >
          <div class="cv-upload-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          </div>
          <div class="cv-upload-info">
            <div class="cv-upload-title">Master CV</div>
            <div class="cv-file-label" id="cvFileLabel">.pdf</div>
          </div>
          <div class="cv-badge" id="cvBadge">none</div>
        </div>

        <textarea
          class="jd-textarea"
          id="jdInput"
          placeholder="Paste the full job description here..."
          spellcheck="false"
        ></textarea>
        <button class="btn-generate" id="generateBtn" onclick="generate()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
          Generate CV + Cover Letter
        </button>
        <div class="btn-clear-row">
          <button class="btn-clear" onclick="clearJD()">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
            Clear JD
          </button>
          <button class="btn-clear" onclick="clearAll()">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
            Clear all
          </button>
        </div>
        <div class="status-box" id="statusBox">
          Paste a job description above, then click generate.
        </div>
      </div>
    </div>

    <div class="divider-v"></div>

    <!-- Right panel: output -->
    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">Output</span>
      </div>
      <div class="panel-body" id="outputBody">
        <div class="output-empty">
          <div class="empty-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
          </div>
          <p>Tailored .docx files will appear here ready to download.</p>
        </div>
      </div>
    </div>

  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script src="app.js"></script>
</body>
</html>
