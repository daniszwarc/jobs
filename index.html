<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CV Tailor — Dani Szwarc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ── Reset & Base ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #f5f5f3;
  --bg-1: #ffffff;
  --bg-2: #f9f9f8;
  --bg-3: #efefed;
  --border: #e2e2de;
  --border-2: #c8c8c2;
  --text: #1a1a18;
  --text-2: #5a5a54;
  --text-3: #9a9a92;
  --accent: #2563eb;
  --accent-dim: #dbeafe;
  --accent-text: #1d4ed8;
  --success: #16a34a;
  --success-dim: #dcfce7;
  --error: #dc2626;
  --error-dim: #fee2e2;
  --mono: 'IBM Plex Mono', monospace;
  --sans: 'IBM Plex Sans', sans-serif;
  --radius: 6px;
  --radius-lg: 10px;
}

html, body { height: 100%; }

body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

/* ── Layout ── */
.app {
  display: grid;
  grid-template-rows: auto 1fr;
  min-height: 100vh;
}

header {
  border-bottom: 1px solid var(--border);
  padding: 0 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 52px;
  background: var(--bg-1);
}

.header-left {
  display: flex;
  align-items: center;
  gap: 16px;
}

.logo {
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 500;
  color: var(--text);
  letter-spacing: -0.01em;
}

.logo span {
  color: var(--accent-text);
}

.version-tag {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--text-3);
  background: var(--bg-3);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 1px 6px;
}



/* ── Main grid ── */
main {
  display: grid;
  grid-template-columns: 1fr 1px 1fr;
  overflow: hidden;
  height: calc(100vh - 52px);
}

.divider-v {
  background: var(--border);
}

/* ── Panels ── */
.panel {
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.panel-header {
  padding: 14px 24px 12px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}

.panel-title {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 500;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

.panel-body {
  flex: 1;
  overflow-y: auto;
  padding: 20px 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* ── Textarea ── */
.jd-textarea {
  flex: 1;
  width: 100%;
  min-height: 300px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 13.5px;
  line-height: 1.7;
  padding: 16px;
  resize: none;
  outline: none;
  transition: border-color 0.15s;
}
.jd-textarea:focus { border-color: var(--border-2); }
.jd-textarea::placeholder { color: var(--text-3); }

/* ── Generate button ── */
.btn-generate {
  width: 100%;
  padding: 11px 20px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: var(--radius);
  font-family: var(--sans);
  font-size: 13.5px;
  font-weight: 500;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: opacity 0.15s, transform 0.1s;
  letter-spacing: 0.01em;
}
.btn-generate:hover:not(:disabled) { opacity: 0.88; }
.btn-generate:active:not(:disabled) { transform: scale(0.99); }
.btn-generate:disabled { opacity: 0.35; cursor: not-allowed; }

/* ── Status box ── */
.status-box {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 14px 16px;
  font-size: 13px;
  color: var(--text-2);
  line-height: 1.6;
}
.status-box.error {
  background: var(--error-dim);
  border-color: var(--error);
  color: var(--error);
}
.status-box.success {
  background: var(--success-dim);
  border-color: var(--success);
  color: var(--success);
}

/* ── Progress steps ── */
.steps { display: flex; flex-direction: column; gap: 10px; }
.step {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 12.5px;
  color: var(--text-3);
  font-family: var(--mono);
}
.step.active { color: var(--text); }
.step.done { color: var(--success); }

.step-icon {
  width: 16px;
  height: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.step-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--border-2);
}
.step.active .step-dot { background: var(--accent); }
.step.done .step-dot { background: var(--success); }

/* ── Spinner ── */
@keyframes spin { to { transform: rotate(360deg); } }
.spinner {
  width: 13px;
  height: 13px;
  border: 1.5px solid var(--border-2);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.65s linear infinite;
}

/* ── Output area ── */
.output-empty {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 10px;
  color: var(--text-3);
  text-align: center;
  padding: 40px;
}

.empty-icon {
  width: 40px;
  height: 40px;
  border: 1px dashed var(--border-2);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-3);
  font-size: 18px;
  margin-bottom: 4px;
}

.output-empty p {
  font-size: 13px;
  line-height: 1.6;
  max-width: 260px;
  color: var(--text-3);
}

/* ── Download cards ── */
.download-card {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 16px 18px;
  display: flex;
  align-items: center;
  gap: 14px;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
  text-decoration: none;
}
.download-card:hover {
  border-color: var(--border-2);
  background: var(--bg-3);
}

.download-card-icon {
  width: 36px;
  height: 36px;
  border-radius: var(--radius);
  background: var(--accent-dim);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  color: var(--accent-text);
}

.download-card-info { flex: 1; }
.download-card-name {
  font-size: 13.5px;
  font-weight: 500;
  color: var(--text);
}
.download-card-file {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text-3);
  margin-top: 2px;
}

.download-card-arrow {
  color: var(--text-3);
  font-size: 16px;
}

/* ── Notes box ── */
.notes-box {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-left: 3px solid var(--accent);
  border-radius: var(--radius-lg);
  padding: 14px 16px;
}
.notes-label {
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--accent-text);
  margin-bottom: 6px;
}
.notes-text {
  font-size: 13px;
  color: var(--text-2);
  line-height: 1.65;
}

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--bg-3); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--border-2); }

/* ── CV Upload zone ── */
.cv-upload-zone {
  border: 1.5px dashed var(--border-2);
  border-radius: var(--radius-lg);
  padding: 16px 18px;
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
  background: var(--bg-2);
  position: relative;
}
.cv-upload-zone:hover {
  border-color: var(--accent);
  background: var(--accent-dim);
}
.cv-upload-zone input[type="file"] {
  position: absolute;
  inset: 0;
  opacity: 0;
  cursor: pointer;
  width: 100%;
  height: 100%;
}
.cv-upload-icon {
  width: 32px;
  height: 32px;
  border-radius: var(--radius);
  background: var(--bg-3);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  color: var(--text-3);
}
.cv-upload-info { flex: 1; min-width: 0; }
.cv-upload-title {
  font-size: 13px;
  font-weight: 500;
  color: var(--text);
}
.cv-file-label {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text-3);
  margin-top: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.cv-badge {
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 500;
  padding: 2px 7px;
  border-radius: 3px;
  flex-shrink: 0;
  background: var(--bg-3);
  color: var(--text-3);
  border: 1px solid var(--border);
}
.cv-badge.ok {
  background: var(--success-dim);
  color: var(--success);
  border-color: var(--success);
}
.cv-badge.err {
  background: var(--error-dim);
  color: var(--error);
  border-color: var(--error);
}

/* ── Responsive ── */
@media (max-width: 768px) {
  main { grid-template-columns: 1fr; grid-template-rows: 1fr 1px 1fr; height: auto; }
  .divider-v { width: 100%; height: 1px; }
  main { height: auto; overflow: visible; }
  .panel { height: 60vh; }
}
</style>
</head>
<body>
<div class="app">

  <!-- Header -->
  <header>
    <div class="header-left">
      <div class="logo">cv<span>.</span>tailor</div>
      <div class="version-tag">v1.0</div>
    </div>
    <div style="font-family:var(--mono);font-size:11px;color:var(--text-3)">qwen3.6 via nan.builders</div>
  </header>

  <!-- Main -->
  <main>

    <!-- Left panel: input -->
    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">Job Description</span>
      </div>
      <div class="panel-body">

        <!-- CV Upload -->
        <div class="cv-upload-zone" id="cvDropZone">
          <input
            type="file"
            id="cvFileInput"
            accept=".pdf"
            onchange="handleCVUpload(this.files[0])"
          >
          <div class="cv-upload-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          </div>
          <div class="cv-upload-info">
            <div class="cv-upload-title">Master CV</div>
            <div class="cv-file-label" id="cvFileLabel">.pdf</div>
          </div>
          <div class="cv-badge" id="cvBadge">none</div>
        </div>

        <textarea
          class="jd-textarea"
          id="jdInput"
          placeholder="Paste the full job description here..."
          spellcheck="false"
        ></textarea>
        <button class="btn-generate" id="generateBtn" onclick="generate()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
          Generate CV + Cover Letter
        </button>
        <div class="status-box" id="statusBox">
          Paste a job description above, then click generate.
        </div>
      </div>
    </div>

    <div class="divider-v"></div>

    <!-- Right panel: output -->
    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">Output</span>
      </div>
      <div class="panel-body" id="outputBody">
        <div class="output-empty">
          <div class="empty-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
          </div>
          <p>Tailored .docx files will appear here ready to download.</p>
        </div>
      </div>
    </div>

  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/docx@9.5.0/build/index.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script>
// ── PDF.js worker setup ───────────────────────────────────────────────────
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";

// ── Master CV (uploaded per session) ─────────────────────────────────────────

let uploadedCV = null;

async function handleCVUpload(file) {
  if (!file) return;
  const label = document.getElementById('cvFileLabel');
  const badge = document.getElementById('cvBadge');

  if (!file.name.toLowerCase().endsWith('.pdf')) {
    label.textContent = 'Only .pdf supported';
    badge.className = 'cv-badge err';
    badge.textContent = 'error';
    return;
  }

  label.textContent = file.name;
  badge.className = 'cv-badge';
  badge.textContent = 'reading...';

  try {
    const arrayBuffer = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
    let text = '';
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      text += content.items.map(item => item.str).join(' ') + '\n';
    }
    uploadedCV = text.trim();
    badge.className = 'cv-badge ok';
    badge.textContent = 'loaded';
  } catch (err) {
    label.textContent = 'Error reading PDF';
    badge.className = 'cv-badge err';
    badge.textContent = 'error';
    console.error(err);
  }
}

// ── API Key managed server-side via proxy ─────────────────────────────────

// ── Status helpers ─────────────────────────────────────────────────────────

function setStatus(msg, type = '') {
  const el = document.getElementById('statusBox');
  el.textContent = msg;
  el.className = 'status-box' + (type ? ' ' + type : '');
}

function setSteps(steps, activeIdx) {
  const el = document.getElementById('statusBox');
  el.className = 'status-box';
  el.innerHTML = '<div class="steps">' + steps.map((s, i) => {
    let cls = 'step';
    if (i < activeIdx) cls += ' done';
    else if (i === activeIdx) cls += ' active';
    const icon = i < activeIdx
      ? `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`
      : (i === activeIdx ? `<div class="spinner"></div>` : `<div class="step-dot"></div>`);
    return `<div class="${cls}"><div class="step-icon">${icon}</div>${s}</div>`;
  }).join('') + '</div>';
}

// ── Main generate flow ─────────────────────────────────────────────────────

async function generate() {
  if (!uploadedCV) {
    setStatus('Upload your master CV first (.pdf).', 'error');
    return;
  }
  const jd = document.getElementById('jdInput').value.trim();
  if (!jd) {
    setStatus('Paste a job description first.', 'error');
    return;
  }

  const btn = document.getElementById('generateBtn');
  btn.disabled = true;
  document.getElementById('outputBody').innerHTML = `
    <div class="output-empty">
      <div class="empty-icon">
        <div class="spinner" style="width:20px;height:20px;border-width:2px"></div>
      </div>
      <p>Building your documents...</p>
    </div>`;

  const steps = [
    'Analyzing job description',
    'Selecting and framing CV content',
    'Drafting cover letter',
    'Assembling .docx files'
  ];

  try {
    setSteps(steps, 0);
    await sleep(300);
    setSteps(steps, 1);

    const systemPrompt = `You are a CV tailoring assistant for Daniel Szwarc. Given a job description, analyze it and produce tailored CV content + cover letter using ONLY the master CV material below.

${uploadedCV}

Output ONLY valid JSON with no markdown, no backticks, no preamble. Schema:
{
  "company": "company name from JD",
  "role_title": "adapted title line for the CV header (e.g. 'AI Solutions Engineer | Full-Stack Developer')",
  "summary": "adapted professional summary, pick or blend the right variant",
  "projects": [
    {
      "name": "Project Name",
      "label": "| short label / context",
      "bullets": ["bullet 1", "bullet 2"]
    }
  ],
  "experience": [
    {
      "title": "Job Title",
      "company": "Company Name",
      "location": "City, Province",
      "dates": "2014 - Present",
      "type": "primary | consulting_intro | consulting_subrole",
      "bullets": ["bullet or intro line"]
    }
  ],
  "skills": [
    { "label": "AI / ML", "value": "LangChain, LangGraph..." }
  ],
  "cover_letter": {
    "salutation": "Hi,",
    "para1": "opening -- why this role/company caught attention, no filler",
    "para2": "fit -- one concrete proof point: what was built, what wasn't, result",
    "para3": "why this company specifically, reference something real from JD",
    "para4": "brief confident close, no cliches"
  },
  "brief": "2-3 sentences on what was emphasized, what was left out, and why"
}`;

    const res = await fetch('/api/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        messages: [
          { role: 'system', content: systemPrompt },
          { role: 'user', content: 'Job description:\n\n' + jd }
        ]
      })
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error?.message || `API error ${res.status}`);
    }

    setSteps(steps, 2);
    const data = await res.json();
    const raw = (data.choices?.[0]?.message?.content || '').replace(/```json|```/g, '').replace(/<think>[\s\S]*?<\/think>/g, '').trim();
    const cv = JSON.parse(raw);

    setSteps(steps, 3);
    await sleep(200);

    const year = new Date().getFullYear();
    const company = (cv.company || 'Company').replace(/[^a-zA-Z0-9]/g, '_').replace(/_+/g, '_');

    const cvBlob = await buildCV(cv);
    const clBlob = await buildCoverLetter(cv);

    renderOutput(cvBlob, clBlob, company, year, cv.brief);
    setStatus('Both files ready.', 'success');

  } catch (e) {
    console.error(e);
    setStatus('Error: ' + e.message, 'error');
    document.getElementById('outputBody').innerHTML = `
      <div class="output-empty">
        <p style="color:var(--error)">Something went wrong. Check the console for details.</p>
      </div>`;
  } finally {
    btn.disabled = false;
  }
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// ── Render output ──────────────────────────────────────────────────────────

function renderOutput(cvBlob, clBlob, company, year, brief) {
  const body = document.getElementById('outputBody');
  body.innerHTML = '';

  body.appendChild(makeDownloadCard(
    cvBlob,
    `Daniel_Szwarc_CV_${company}_${year}.docx`,
    'Tailored CV',
    cvIcon()
  ));

  body.appendChild(makeDownloadCard(
    clBlob,
    `Daniel_Szwarc_CoverLetter_${company}_${year}.docx`,
    'Cover Letter',
    mailIcon()
  ));

  if (brief) {
    const box = document.createElement('div');
    box.className = 'notes-box';
    box.innerHTML = `<div class="notes-label">Framing notes</div><div class="notes-text">${escHtml(brief)}</div>`;
    body.appendChild(box);
  }
}

function makeDownloadCard(blob, filename, label, iconSvg) {
  const url = URL.createObjectURL(blob);
  const card = document.createElement('div');
  card.className = 'download-card';
  card.innerHTML = `
    <div class="download-card-icon">${iconSvg}</div>
    <div class="download-card-info">
      <div class="download-card-name">${escHtml(label)}</div>
      <div class="download-card-file">${escHtml(filename)}</div>
    </div>
    <div class="download-card-arrow">${dlIcon()}</div>`;
  card.addEventListener('click', () => {
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.click();
  });
  return card;
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function cvIcon() {
  return `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>`;
}
function mailIcon() {

// ── Build CV .docx ─────────────────────────────────────────────────────────

async function buildCV(cv) {
  const {
    Document, Packer, Paragraph, TextRun,
    AlignmentType, LevelFormat, BorderStyle, TabStopType
  } = window.docx;

  const ACCENT    = "1B4F8A";
  const GRAY      = "666666";
  const BLACK     = "000000";
  const WIDTH     = 10080;

  const divider = () => new Paragraph({
    spacing: { before: 0, after: 80 },
    border: { bottom: { style: BorderStyle.SINGLE, size: 6, color: ACCENT, space: 1 } },
    children: []
  });

  const section = (t) => new Paragraph({
    spacing: { before: 160, after: 60 },
    children: [new TextRun({ text: t.toUpperCase(), bold: true, size: 22, color: ACCENT, font: "Arial" })]
  });

  const bul = (text) => new Paragraph({
    numbering: { reference: "bullets", level: 0 },
    spacing: { before: 20, after: 20 },
    children: [new TextRun({ text, size: 18, font: "Arial", color: BLACK })]
  });

  const plain = (text, opts = {}) => new Paragraph({
    spacing: { before: opts.before ?? 20, after: opts.after ?? 20 },
    children: [new TextRun({
      text, size: opts.size ?? 18, font: "Arial",
      color: opts.color ?? BLACK,
      bold: opts.bold ?? false,
      italics: opts.italics ?? false
    })]
  });

  const jobH = (title, co, loc, dates) => new Paragraph({
    spacing: { before: 120, after: 30 },
    tabStops: [{ type: TabStopType.RIGHT, position: WIDTH }],
    children: [
      new TextRun({ text: title, bold: true, size: 20, font: "Arial", color: BLACK }),
      new TextRun({ text: "  |  ", size: 18, font: "Arial", color: GRAY }),
      new TextRun({ text: co, size: 20, font: "Arial", color: ACCENT }),
      new TextRun({ text: "  |  " + loc, size: 18, font: "Arial", color: GRAY }),
      new TextRun({ text: "\t" + dates, size: 18, font: "Arial", color: GRAY })
    ]
  });

  const subH = (text, dates) => {
    const children = [new TextRun({ text, bold: true, size: 19, font: "Arial", color: BLACK })];
    if (dates) children.push(new TextRun({ text: "\t" + dates, size: 18, font: "Arial", color: GRAY }));
    return new Paragraph({
      spacing: { before: 100, after: 20 },
      tabStops: [{ type: TabStopType.RIGHT, position: WIDTH }],
      children
    });
  };

  const projH = (name, label) => new Paragraph({
    spacing: { before: 110, after: 20 },
    children: [
      new TextRun({ text: name, bold: true, size: 19, font: "Arial", color: BLACK }),
      new TextRun({ text: "  " + label, size: 17, font: "Arial", color: GRAY, italics: true })
    ]
  });

  const skillRow = (label, value) => new Paragraph({
    spacing: { before: 24, after: 24 },
    children: [
      new TextRun({ text: label + ": ", bold: true, size: 18, font: "Arial", color: BLACK }),
      new TextRun({ text: value, size: 18, font: "Arial", color: BLACK })
    ]
  });

  // Build experience blocks
  const expBlocks = [];
  const exp = cv.experience || [];
  exp.forEach((e, i) => {
    if (e.type === 'primary' || i === 0) {
      expBlocks.push(jobH(e.title, e.company, e.location, e.dates));
      (e.bullets || []).forEach(b => expBlocks.push(bul(b)));
    } else if (e.type === 'consulting_intro') {
      expBlocks.push(subH(e.title + "  |  " + e.company, e.dates));
      expBlocks.push(plain(e.bullets?.[0] || '', { before: 20, after: 30 }));
      (e.bullets?.slice(1) || []).forEach(b => expBlocks.push(bul(b)));
    } else {
      expBlocks.push(subH(e.title, e.dates));
      (e.bullets || []).forEach(b => expBlocks.push(bul(b)));
    }
  });

  const children = [
    // Header
    new Paragraph({
      alignment: AlignmentType.CENTER, spacing: { before: 0, after: 40 },
      children: [new TextRun({ text: "DANIEL SZWARC", bold: true, size: 40, font: "Arial", color: BLACK })]
    }),
    new Paragraph({
      alignment: AlignmentType.CENTER, spacing: { before: 0, after: 40 },
      children: [new TextRun({ text: cv.role_title || "AI Automation Engineer  |  Full-Stack Developer", size: 22, font: "Arial", color: ACCENT })]
    }),
    new Paragraph({
      alignment: AlignmentType.CENTER, spacing: { before: 0, after: 60 },
      children: [new TextRun({ text: "Montreal, Quebec  |  514.220.4421  |  dani@thiez.com  |  linkedin.com/in/daniszwarc  |  github.com/daniszwarc", size: 17, font: "Arial", color: GRAY })]
    }),
    divider(),
    // Summary
    section("Professional Summary"),
    plain(cv.summary || ''),
    divider(),
    // Projects
    section("Current AI Projects"),
    ...(cv.projects || []).flatMap(p => [
      projH(p.name, p.label),
      ...(p.bullets || []).map(b => bul(b))
    ]),
    divider(),
    // Experience
    section("Professional Experience"),
    ...expBlocks,
    divider(),
    // Skills
    section("Technical Skills"),
    ...(cv.skills || []).map(s => skillRow(s.label, s.value)),
    divider(),
    // Education
    section("Education"),
    subH("Master of Science in Artificial Intelligence (Expected 2026)", "2024 - Present"),
    plain("University of Liverpool, England", { before: 0, after: 10, color: GRAY }),
    plain("Dissertation: WorkflowSynth -- LLM-guided programme synthesis with formal verification for enterprise workflows", { before: 0, after: 20, color: GRAY, italics: true }),
    subH("Microcomputer Programming & Web Developer Certificates", "1999 - 2001"),
    plain("Centennial College, Toronto, ON", { before: 0, after: 20, color: GRAY }),
    plain("Earlier studies in Electronic Engineering, Sound Design, and Technical Electronics -- Buenos Aires, Argentina (1985-1993)", { before: 20, after: 20, color: GRAY, italics: true }),
    divider(),
    // Certs
    section("Certifications & Professional Development"),
    bul("LangChain Developer Certification  |  LangChain Inc."),
    bul("Agentic RAG Specialization  |  Coursera"),
    bul("AI & Automation Specializations  |  Coursera / Udemy"),
  ];

  const doc = new Document({
    numbering: {
      config: [{
        reference: "bullets",
        levels: [{
          level: 0,
          format: LevelFormat.BULLET,
          text: "\u2022",
          alignment: AlignmentType.LEFT,
          style: { paragraph: { indent: { left: 480, hanging: 240 } } }
        }]
      }]
    },
    styles: { default: { document: { run: { font: "Arial", size: 18 } } } },
    sections: [{
      properties: { page: { size: { width: 12240, height: 15840 }, margin: { top: 1080, right: 1080, bottom: 1080, left: 1080 } } },
      children
    }]
  });

  return Packer.toBlob(doc);
}

// ── Build Cover Letter .docx ───────────────────────────────────────────────

async function buildCoverLetter(cv) {
  const { Document, Packer, Paragraph, TextRun, AlignmentType, BorderStyle } = window.docx;

  const ACCENT = "1B4F8A";
  const GRAY   = "666666";
  const BLACK  = "000000";

  const para = (text, opts = {}) => new Paragraph({
    spacing: { before: opts.before ?? 0, after: opts.after ?? 200 },
    children: [new TextRun({
      text, size: opts.size ?? 21, font: "Arial",
      color: opts.color ?? BLACK,
      bold: opts.bold ?? false
    })]
  });

  const cl = cv.cover_letter || {};
  const month = new Date().toLocaleString('default', { month: 'long' });
  const year  = new Date().getFullYear();

  const doc = new Document({
    styles: { default: { document: { run: { font: "Arial", size: 21 } } } },
    sections: [{
      properties: { page: { size: { width: 12240, height: 15840 }, margin: { top: 1080, right: 1080, bottom: 1080, left: 1080 } } },
      children: [
        new Paragraph({
          alignment: AlignmentType.CENTER, spacing: { before: 0, after: 40 },
          children: [new TextRun({ text: "DANIEL SZWARC", bold: true, size: 36, font: "Arial", color: BLACK })]
        }),
        new Paragraph({
          alignment: AlignmentType.CENTER, spacing: { before: 0, after: 120 },
          children: [new TextRun({ text: "Montreal, Quebec  |  514.220.4421  |  dani@thiez.com  |  linkedin.com/in/daniszwarc", size: 17, font: "Arial", color: GRAY })]
        }),
        new Paragraph({
          spacing: { before: 0, after: 240 },
          border: { bottom: { style: BorderStyle.SINGLE, size: 6, color: ACCENT, space: 1 } },
          children: []
        }),
        para(`${month} ${year}`, { after: 200, color: GRAY, size: 19 }),
        para(cv.company || "Hiring Team", { after: 20 }),
        para("", { after: 200 }),
        para(cl.salutation || "Hi,", { after: 240 }),
        para(cl.para1 || "", { after: 220 }),
        para(cl.para2 || "", { after: 220 }),
        para(cl.para3 || "", { after: 220 }),
        para(cl.para4 || "", { after: 340 }),
        para("Best,", { after: 220 }),
        para("Daniel Szwarc", { after: 0, bold: true }),
      ]
    }]
  });

  return Packer.toBlob(doc);
}
